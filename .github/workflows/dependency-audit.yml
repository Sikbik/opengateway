name: Dependency Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "gui/package.json"
      - "gui/package-lock.json"
      - "gui/src-tauri/Cargo.toml"
      - "gui/src-tauri/Cargo.lock"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "gui/package.json"
      - "gui/package-lock.json"
      - "gui/src-tauri/Cargo.toml"
      - "gui/src-tauri/Cargo.lock"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V
          cargo -V

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Verify inactive HTTP/3 dependencies stay inactive
        run: |
          set -euo pipefail
          if cargo tree --locked --target all --edges normal | grep -E '(^| )quinn v|(^| )quinn-proto v|(^| )h3-quinn v|(^| )rand v'; then
            echo "::error::A reqwest HTTP/3/QUIC dependency is active. Remove the cargo-audit ignore and audit the active graph before shipping."
            exit 1
          fi

      - name: Audit root Rust dependencies
        # reqwest 0.12 locks optional HTTP/3/QUIC packages even when the http3
        # feature is inactive. The graph check above keeps these exceptions narrow
        # until quinn-proto 0.11.15 satisfies the local 7-day package-age rule.
        run: cargo audit --ignore RUSTSEC-2026-0185 --ignore RUSTSEC-2026-0097

      - name: Audit GUI Rust dependencies
        working-directory: gui/src-tauri
        run: cargo audit

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Audit GUI production dependencies
        working-directory: gui
        run: npm audit --omit=dev
